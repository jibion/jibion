name: Update Experience Years

on:
  schedule:
    - cron: '0 0 1 1 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Calculate years and update README
        run: |
          YEARS=$(( $(date +%Y) - 2010 ))
          sed -i "s/<!-- yrs -->[0-9]*<!-- yrs -->/<!-- yrs -->$YEARS<!-- yrs -->/g" README.md
          YEARS_MANAGER=$(( $(date +%Y) - 2020 ))
          sed -i "s/<!-- yrs_mng -->[0-9]*<!-- yrs_mng -->/<!-- yrs_mng -->$YEARS_MANAGER<!-- yrs_mng -->/g" README.md

      - name: Commit changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet --staged || git commit -m "chore: update experience to $YEARS years and management for $YEARS_MANAGER years"
          git push
